[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lending-risk-mcp"
version = "0.1.0"
description = "An MCP server that gives Claude governed access to HMDA, CFPB complaints, SEC EDGAR, FRED and Linear for lending risk review."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Siddharth Shankar" }]
dependencies = [
  "mcp>=2.2,<3",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
lending-risk-mcp = "lending_risk_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lending_risk_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # en/em dashes in docstrings are fine
