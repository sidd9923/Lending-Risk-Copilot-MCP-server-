# Seed registry: one canonical lender -> its identity in each source.
#
# Why this file exists: the same company is spelled differently everywhere.
#   HMDA   files under the *bank subsidiary's* LEI  ("Wells Fargo Bank, National Association")
#   CFPB   uses its own company string             ("WELLS FARGO & COMPANY")
#   EDGAR  files under the *holding company's* CIK  ("WELLS FARGO & COMPANY/MN")
#
# Fields left null are resolved at runtime (HMDA filer list, CFPB company
# suggest, SEC ticker file) and cached. Run `python scripts/verify_registry.py`
# to check every pinned value against the live sources.

lenders:
  - id: wells_fargo
    display_name: Wells Fargo
    aliases: [wells fargo, wells, wfc, wells fargo bank]
    cik: 72971
    cfpb_company: "WELLS FARGO & COMPANY"
    hmda_name_hint: "Wells Fargo Bank"
    lei: null

